retrieval_and_regeneration:
  - obtain each source lawfully from its DOI, database, publisher, or institutional access URL
  - record the source version and retrieval date without copying publisher prose or layout
  - extract required facts into a private local artifact following the canonical semantic contract
  - run the Project Krypton-authored transformation locally
  - list each generated artifact in evidence-pack-manifest.json with its SHA-256
  - load through KRYPTON_LOCAL_EVIDENCE_PACK; digest mismatch fails closed
digest_namespaces:
  PRIVATE_CANONICAL_HASH: retained only in the private research record and migration audit
  PUBLIC_METADATA_HASH: digest of redistributable reference metadata
  LOCAL_REGENERATION_HASH: digest computed by the user for a lawfully regenerated local artifact
