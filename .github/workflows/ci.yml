name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  windows-line-endings:
    name: Windows checkout / line-ending parity
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Configure standard Windows Git conversion
        shell: pwsh
        run: git config --global core.autocrlf true
      - name: Check out public source after conversion is configured
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify canonical LF checkout
        shell: pwsh
        run: |
          $unexpected = git ls-files --eol | Where-Object { $_ -notmatch 'w/lf' }
          if ($unexpected) {
            $unexpected | Write-Error
            throw 'Tracked files were not checked out with canonical LF bytes.'
          }
          $expected = '0d542e0c8804e39aa7f37eb00da5a762149dc682d7829451287e11b938e94594'
          $actual = (Get-FileHash -Algorithm SHA256 LICENSE).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "LICENSE byte digest mismatch: $actual"
          }
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned public dependencies and source
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.lock
          python -m pip install -e ".[test]"
      - name: Check dependency integrity
        run: python -m pip check
      - name: Run complete public test suite
        run: python -m pytest -q
      - name: Verify frozen bytes and public boundary
        run: |
          python scripts/verify_public_boundary.py
          python scripts/verify_task7a_private_candidate.py
      - name: Run synthetic representative demo
        run: python -m krypton.demo

  source:
    name: Source tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out public source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned public dependencies and source
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.lock
          python -m pip install -e ".[test]"
      - name: Check dependency integrity
        run: python -m pip check
      - name: Run complete public test suite
        run: python -m pytest -q
      - name: Verify public/private and rights boundaries
        run: |
          python scripts/verify_public_boundary.py
          python scripts/verify_task7a_private_candidate.py
      - name: Verify generated schema parity
        run: |
          python scripts/export_public_schemas.py
          git diff --exit-code -- src/krypton/resources/schemas
      - name: Run synthetic representative demo
        run: python -m krypton.demo

  distribution:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out public source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.lock
      - name: Build wheel and source distribution
        run: python -m hatchling build
      - name: Verify distribution contents and boundary
        run: python scripts/verify_distribution.py

  installed-wheel:
    name: Installed wheel and resource parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out public source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up build Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Build wheel from public source
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.lock
          python -m hatchling build
      - name: Create isolated installed-wheel environment
        run: |
          python -m venv "${RUNNER_TEMP}/krypton-wheel-env"
          "${RUNNER_TEMP}/krypton-wheel-env/bin/python" -m pip install --requirement requirements.lock
          "${RUNNER_TEMP}/krypton-wheel-env/bin/python" -m pip install --no-deps dist/project_krypton-1.0.0-py3-none-any.whl
      - name: Check installed dependency integrity
        run: |
          "${RUNNER_TEMP}/krypton-wheel-env/bin/python" -m pip check
      - name: Test installed wheel outside source directory
        working-directory: ${{ runner.temp }}
        run: |
          krypton_py="${RUNNER_TEMP}/krypton-wheel-env/bin/python"
          "$krypton_py" -m pytest -q "${GITHUB_WORKSPACE}/tests"
          "$krypton_py" -m krypton
          "$krypton_py" -m krypton.demo

  citation:
    name: Validate CFF 1.2.0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned CFF validator
        run: python -m pip install cffconvert==2.0.0
      - name: Validate citation metadata
        run: cffconvert --validate --infile CITATION.cff

  docker-build:
    name: Docker build and public tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out public source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build pinned-base image
        run: docker build --target test --tag project-krypton-ci:1.0.0 .
      - name: Run public tests in image
        run: docker run --rm project-krypton-ci:1.0.0 python -m pytest -q
      - name: Run synthetic demo in image
        run: docker run --rm project-krypton-ci:1.0.0 python -m krypton.demo
