name: Documentation issue
description: Report unclear, missing, or inconsistent public documentation.
title: "[Docs]: "
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: Quote only Project Krypton text. Do not upload publisher material, private evidence packs, patient data, or confidential scientific data.
  - type: input
    id: location
    attributes:
      label: Document and section
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and proposed clarification
    validations:
      required: true
